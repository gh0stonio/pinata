<svg width="256" height="256" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-arc">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-pi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-needle">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="arc-grad" x1="26" y1="60" x2="94" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5E81AC"/>
      <stop offset="50%" stop-color="#88C0D0"/>
      <stop offset="100%" stop-color="#5E81AC"/>
    </linearGradient>
    <linearGradient id="needle-north" x1="60" y1="18" x2="60" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#88C0D0"/>
      <stop offset="100%" stop-color="#5E81AC"/>
    </linearGradient>
  </defs>

  <!-- Ring -->
  <circle cx="60" cy="60" r="34" stroke="#3B4252" stroke-width="1.2" fill="none"/>

  <!-- Top arc (N) — glowing gradient -->
  <path d="M 26 60 A 34 34 0 0 1 94 60"
        stroke="url(#arc-grad)" stroke-width="2.8"
        fill="none" stroke-linecap="round"
        filter="url(#glow-arc)"/>

  <!-- Bottom arc (S) — dim -->
  <path d="M 94 60 A 34 34 0 0 1 26 60"
        stroke="#434C5E" stroke-width="2.8"
        fill="none" stroke-linecap="round"/>

  <!-- Dashed diameter -->
  <line x1="26" y1="60" x2="94" y2="60"
        stroke="#88C0D0" stroke-width="0.9"
        stroke-dasharray="3 3" opacity="0.3"/>

  <!-- North needle -->
  <polygon points="60,18 56,58 60,51 64,58"
           fill="url(#needle-north)"
           filter="url(#glow-needle)"/>

  <!-- South needle -->
  <polygon points="60,102 56,62 60,69 64,62"
           fill="#434C5E"/>

  <!-- π at North -->
  <text x="60" y="13"
        font-family="JetBrains Mono, monospace"
        font-size="10" font-weight="700"
        fill="#88C0D0" text-anchor="middle"
        filter="url(#glow-pi)">π</text>

  <!-- S/E/W cardinals -->
  <text x="60"  y="109" font-family="JetBrains Mono, monospace" font-size="8" font-weight="500" fill="#4C6A8A" text-anchor="middle">S</text>
  <text x="108" y="63"  font-family="JetBrains Mono, monospace" font-size="8" font-weight="500" fill="#4C6A8A" text-anchor="middle">E</text>
  <text x="12"  y="63"  font-family="JetBrains Mono, monospace" font-size="8" font-weight="500" fill="#4C6A8A" text-anchor="middle">W</text>

  <!-- Center hub -->
  <circle cx="60" cy="60" r="5" fill="none" stroke="#434C5E" stroke-width="1.5"/>
  <circle cx="60" cy="60" r="2" fill="#88C0D0" opacity="0.9"/>
</svg>
